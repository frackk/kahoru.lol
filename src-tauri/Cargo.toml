[package]
name = "kahoru-lol"
version = "0.1.0"
description = "Preparación de partidas de League of Legends — made by frack.one"
authors = ["frack.one"]
edition = "2021"
rust-version = "1.99.1"

[lib]
name = "kahoru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
