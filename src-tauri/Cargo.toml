[package]
name = "kahoru-lol"
version = "0.8.0"
description = "Preparación de partidas de League of Legends — made by frack.one"
authors = ["frack.one"]
edition = "2021"
rust-version = "1.99.1"

[lib]
name = "kahoru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
